<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Nav Pills</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >
</head>

<body>

<div class="container mt-4">

    <!-- Horizontal Nav -->
    <ul class="nav nav-pills">
        <li class="nav-item">
            <a class="nav-link active" href="#">
                Home <span class="badge bg-secondary">42</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Profile</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">
                Messages <span class="badge bg-secondary">3</span>
            </a>
        </li>
    </ul>

    <br>

    <h4>Example for active state in navigation</h4>

    <!-- Vertical Nav -->
    <ul class="nav nav-pills flex-column" style="max-width: 260px;">
        <li class="nav-item">
            <a class="nav-link active" href="#">
                Home <span class="badge bg-secondary float-end">42</span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">Profile</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="#">
                Messages <span class="badge bg-secondary float-end">3</span>
            </a>
        </li>
    </ul>

</div>

<!-- Bootstrap 5 JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
</script>

</body>
</html>
