<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BootStrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
    .customize-color {
        background-color: lightgray !important;
        color: brown !important;
    }
</style>        
</head>
<body>
    <h1 class="text-danger bg-black customize-color">hello</h1>
    <p class="text-success bg-body-secondary customize-color">welcome to bootstrap</p>
    <button class="btn btn-primary customize-color">click me</button>
    <p class="fs-1 text-info bg-dark customize-color">This is large text</p>
    <p class="fs-6 text-info bg-dark customize-color">This is small text</p>
    <p class="fst-italic text-info bg-dark customize-color">This is italic text</p>
    <p class="fst-normal text-info bg-dark customize-color">This is normal text</p>
    <p class="fw-bold text-info bg-dark customize-color">This is bold text</p>
    <p class="fw-light text-info bg-dark customize-color">This is light text</p>
    <p class="text-decoration-underline text-info bg-dark customize-color">This is underline text</p>
    <p class="text-decoration-line-through text-info bg-dark customize-color">This is line through text</p>
</body>

</html>
